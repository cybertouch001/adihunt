<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>AdiHunt Admin</title><link rel="icon" href="../favicon.png"><link rel="stylesheet" href="vendor/leaflet.css"><link rel="stylesheet" href="app.css">
<style>body{overflow:auto;height:auto}#adm{max-width:1100px;margin:0 auto;padding:12px}nav.top{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;background:#0a0714ee;padding:8px 0;z-index:5;backdrop-filter:blur(6px)}nav.top button{padding:8px 12px;border-radius:10px;background:var(--card);color:var(--mut);border:1px solid var(--line)}nav.top button.on{background:var(--vi);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:600}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.cards .card b{font-size:22px;display:block}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.two{grid-template-columns:1fr}}.num6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.num6 input{padding:6px;text-align:center}.tag{font-size:11px;padding:1px 7px;border-radius:8px;background:var(--card2)}#pick{height:260px;border-radius:12px;margin:8px 0}#qr canvas,#qr svg,#qr img{background:#fff;padding:8px;border-radius:8px}.tbl{overflow:auto}</style></head>
<body><div id="adm"><div id="login" class="card" style="max-width:360px;margin:12vh auto"><h2>AdiHunt Admin</h2><div class="fld"><label>Admin username</label><input id="lu" autocomplete="username"></div><div class="fld"><label>Password</label><input id="lp" type="password" autocomplete="current-password"></div><div class="err" id="le"></div><button class="btn full" id="lg">Sign in</button><div class="sm mut gap">Separate from the player login.</div></div>
<div id="app2" hidden><div class="row"><h2 class="sp">AdiHunt Admin <span class="tag" id="ver"></span></h2><button class="btn sec sm" id="out">Sign out</button></div><nav class="top" id="nav"></nav><div id="view"></div></div><div id="toasts" style="position:fixed;top:10px;left:10px;right:10px;z-index:99"></div></div>
<script src="vendor/leaflet.js"></script><script src="vendor/qrcode.js"></script><script src="art.js"></script><script src="admin.js"></script></body></html>
